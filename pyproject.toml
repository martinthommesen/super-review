[project]
name = "super-review-skill-workbench"
version = "1.6.0"
description = "Development, validation, and deterministic release workbench for the super-review Agent Skill"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "coverage==7.15.4",
  "pre-commit==4.6.2",
  "ruff==0.16.3",
  "skills-ref==0.1.1",
  "ty==0.0.73",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
extend-exclude = ["cli", "dist"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ty.environment]
python-version = "3.11"
# Match the shipped helpers' runtime sibling resolution during static analysis.
extra-paths = ["src/super-review/scripts", "src/super-review/tests"]

[tool.ty.src]
exclude = ["cli/**", "dist/**"]

[tool.coverage.run]
branch = true
source = [
  "scripts",
  "src/super-review/scripts",
  "src/super-review/tests",
  "tests",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
