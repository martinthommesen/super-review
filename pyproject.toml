[project]
name = "super-review-skill-workbench"
version = "1.3.0"
description = "Development, validation, and deterministic release workbench for the super-review Agent Skill"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "ruff==0.15.22",
  "skills-ref==0.1.1",
  "ty==0.0.62",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
extend-exclude = ["dist"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ty.environment]
python-version = "3.11"
# Shipped tests import sibling runtime helpers resolved from the skill root at
# runtime; mirror that resolution for static analysis.
extra-paths = ["src/super-review/scripts", "src/super-review/tests"]
