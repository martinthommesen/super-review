# The Ruff revision must match the root development pin.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: ty
        name: ty type check
        entry: ty check
        language: system
        pass_filenames: false
        types: [python]
      - id: cli-check
        name: cli lint and test
        entry: make cli-test
        language: system
        pass_filenames: false
        files: ^cli/
