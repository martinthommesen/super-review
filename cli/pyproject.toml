[project]
name = "super-review-cli"
version = "0.1.0"
description = "Consolidated command-line front-end for the super-review FINDINGS helpers"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
super-review = "super_review_cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.3",
]

[tool.ruff]
target-version = "py311"
src = ["src", "../src/super-review/tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
