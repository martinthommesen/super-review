[project]
name = "super-review-companion"
version = "0.1.0"
description = "Optional MCP front-end for super-review FINDINGS helpers"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "mcp==1.28.1",
]

[project.scripts]
super-review-companion = "super_review_companion.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "ruff==0.15.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
